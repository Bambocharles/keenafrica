apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: keen-prod
spec:
  replicas: 2
  selector:
    matchLabels: { app: portal, env: prod }
  template:
    metadata:
      labels: { app: portal, env: prod }
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: portal, env: prod }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: portal
          image: ghcr.io/bambocharles/keenafrica-portal:test
          ports: [{ containerPort: 3000 }]
          envFrom:
            - secretRef: { name: portal-secrets }
          env:
            - name: ROOT_DOMAIN
              value: "keenafrica.com"
            # See portal-dev.yaml for why this is needed - Kubernetes sets
            # HOSTNAME to the pod name, which breaks Next.js standalone's
            # server binding otherwise.
            - name: HOSTNAME
              value: "0.0.0.0"
      imagePullSecrets:
        - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: keen-prod
spec:
  selector: { app: portal, env: prod }
  ports: [{ port: 3000, targetPort: 3000 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal
  namespace: keen-prod
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    # Without this, Traefik doesn't reliably prioritize the exact-host
    # Ingresses (site in keen-prod for the bare domain, site in keen-staging
    # for staging.keenafrica.com) over this wildcard - confirmed as a live
    # regression that broke staging.keenafrica.com until this was added.
    traefik.ingress.kubernetes.io/router.priority: "1"
spec:
  rules:
    - host: "*.keenafrica.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal
                port: { number: 3000 }
