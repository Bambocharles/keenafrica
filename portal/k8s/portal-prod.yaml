apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: keen-prod
spec:
  replicas: 2
  selector:
    matchLabels: { app: portal, env: prod }
  template:
    metadata:
      labels: { app: portal, env: prod }
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: portal, env: prod }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: portal
          image: ghcr.io/bambocharles/keenafrica-portal:test
          ports: [{ containerPort: 3000 }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          # Session 16 (Production Hardening) — /healthz checks real DB
          # connectivity (src/app/healthz/route.ts), not just process
          # liveness. startupProbe gives a cold start (DB connection pool
          # warm-up, Next.js standalone server boot) room before the
          # tighter liveness/readiness periods kick in, so a slow-but-fine
          # boot isn't mistaken for a hang.
          startupProbe:
            httpGet: { path: /healthz, port: 3000 }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            periodSeconds: 15
            failureThreshold: 3
          envFrom:
            - secretRef: { name: portal-secrets }
          env:
            - name: ROOT_DOMAIN
              value: "keenafrica.com"
            # Do NOT set HOSTNAME here - see portal/server-entrypoint.js.
            # Kubernetes injects it as the pod name regardless of this
            # manifest; the entrypoint wrapper deletes it after server.js
            # reads it for binding, so it doesn't leak into Auth.js's
            # redirect URL construction (confirmed this collision breaks
            # post-login redirects otherwise).
      imagePullSecrets:
        - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: keen-prod
spec:
  selector: { app: portal, env: prod }
  ports: [{ port: 3000, targetPort: 3000 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal
  namespace: keen-prod
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    # Without this, Traefik doesn't reliably prioritize the exact-host
    # Ingresses (site in keen-prod for the bare domain, site in keen-staging
    # for staging.keenafrica.com) over this wildcard - confirmed as a live
    # regression that broke staging.keenafrica.com until this was added.
    traefik.ingress.kubernetes.io/router.priority: "1"
spec:
  rules:
    - host: "*.keenafrica.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal
                port: { number: 3000 }
