name: Publish social post

# Runs after the Deploy workflow finishes on main — i.e. only once a
# merged social-post PR (see prepare-social-post.yml) has actually gone
# out to production, which is what makes the card image's public URL
# live. Instagram's Graph API fetches the image from that URL rather
# than accepting a direct upload, so publishing can't happen any earlier.
on:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Publish queued posts to Instagram + Facebook
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_BUSINESS_ACCOUNT_ID: ${{ secrets.META_IG_BUSINESS_ACCOUNT_ID }}
        run: python scripts/publish_social_post.py

      - name: Commit archived post state
        run: |
          git config user.name "keenafrica-bot"
          git config user.email "actions@users.noreply.github.com"
          git add social/
          git diff --cached --quiet || git commit -m "social: archive published post(s) [skip ci]"
          git push
