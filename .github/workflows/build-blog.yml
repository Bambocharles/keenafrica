name: Build blog on merge

on:
  push:
    branches: [main]
    paths:
      - "site/blog/posts/**.md"
      - "scripts/build_blog.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build blog HTML from markdown
        run: |
          pip install markdown pyyaml
          python scripts/build_blog.py

      - name: Commit rebuilt HTML
        run: |
          git config user.name "keenafrica-bot"
          git config user.email "actions@github.com"
          git add site/blog/*.html
          git diff --cached --quiet || git commit -m "blog: rebuild HTML from markdown [skip ci]"
          git push
