name: Deploy

on:
  push:
    branches: [dev, staging, main]

jobs:
  deploy:
    runs-on: [self-hosted, keenafrica-vm]
    steps:
      - uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          case "${{ github.ref_name }}" in
            main)    echo "name=prod"    >> $GITHUB_OUTPUT ;;
            staging) echo "name=staging" >> $GITHUB_OUTPUT ;;
            dev)     echo "name=dev"     >> $GITHUB_OUTPUT ;;
          esac

      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u bambocharles --password-stdin

      - name: Build and push image
        id: image
        run: |
          IMAGE=ghcr.io/bambocharles/keenafrica:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Roll out new image
        env:
          KUBECONFIG: /home/keen/.kube/config
        run: |
          NS=keen-${{ steps.env.outputs.name }}
          kubectl set image -n $NS deployment/site nginx=${{ steps.image.outputs.image }}
          kubectl rollout status -n $NS deployment/site --timeout=120s
