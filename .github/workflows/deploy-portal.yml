name: Deploy Portal

# Deploys straight to production - there is no separate dev/staging portal
# environment. The dev.keenafrica.com static site's dev environment (and
# this workflow's former dev job) were retired together to free resources
# on keenafrica-infra; Phase 1 verification already proved the mechanism
# works end-to-end before this cutover.
on:
  push:
    branches: [main]
    paths: ["portal/**"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  deploy-portal-prod:
    runs-on: [self-hosted, keenafrica-vm]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push image
        id: image
        run: |
          IMAGE=ghcr.io/bambocharles/keenafrica-portal:${{ github.sha }}
          docker build -t $IMAGE portal/
          docker push $IMAGE
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.PORTAL_DATABASE_URL_PROD }}
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          cd portal
          npm ci
          npx prisma migrate deploy

      - name: Roll out to prod
        env:
          KUBECONFIG: /home/keen/.kube/config
        run: |
          kubectl set image -n keen-prod deployment/portal portal=${{ steps.image.outputs.image }}
          kubectl rollout status -n keen-prod deployment/portal --timeout=120s

      - name: Prune old local images
        if: always()
        run: |
          docker images "ghcr.io/bambocharles/keenafrica-portal" --format "{{.Tag}}" \
            | grep -v "^${{ github.sha }}$" \
            | xargs -r -I{} docker rmi "ghcr.io/bambocharles/keenafrica-portal:{}"
          docker image prune -f
