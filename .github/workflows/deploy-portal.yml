name: Deploy Portal

# Deploys straight to production - there is no separate dev/staging portal
# environment. The dev.keenafrica.com static site's dev environment (and
# this workflow's former dev job) were retired together to free resources
# on keenafrica-infra; Phase 1 verification already proved the mechanism
# works end-to-end before this cutover.
on:
  push:
    branches: [main]
    paths: ["portal/**"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  deploy-portal-prod:
    runs-on: [self-hosted, keenafrica-vm]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push image
        id: image
        run: |
          IMAGE=ghcr.io/bambocharles/keenafrica-portal:${{ github.sha }}
          docker build -t $IMAGE portal/
          docker push $IMAGE
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.PORTAL_DATABASE_URL_PROD }}
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          cd portal
          npm ci
          npx prisma migrate deploy

      # Session 34 (Keen Africans) — this step never existed before, and
      # its absence was a real gap: prisma/schema.prisma's Role/Permission
      # rows (e.g. this session's own new KEEN_AFRICAN role, articles.write/
      # articles.manage permissions) only ever get inserted by
      # `npm run seed` (prisma/seed/tasks/roles-permissions.ts), never by a
      # migration. Migrations only change schema. Running the seed with the
      # portal's own runtime DATABASE_URL (the k8s Secret every pod uses)
      # fails — that connection is a deliberately restricted, RLS-enforced
      # application role, and roles/permissions' RLS write policy requires
      # is_super_admin (see the identity_security_foundation migration).
      # PORTAL_DATABASE_URL_PROD is the same elevated "migrator" credential
      # the step above already uses for DDL, so it bypasses RLS the same
      # way. `npm run seed` (never `seed:demo`) runs ONLY the "core" tasks
      # (roles-permissions, super-admin, feature-flags) — all explicitly
      # documented as idempotent and safe to run in production on every
      # deploy: roles-permissions reconciles the Role/Permission catalog
      # from code (schema-defining, not end-user data), and super-admin
      # never overwrites an existing account's password, only creates one
      # if SUPER_ADMIN_EMAIL/SUPER_ADMIN_PASSWORD are set and no such
      # account exists yet.
      - name: Seed core data (roles, permissions, feature flags)
        env:
          DATABASE_URL: ${{ secrets.PORTAL_DATABASE_URL_PROD }}
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          cd portal
          npm ci
          npm run seed

      - name: Roll out to prod
        env:
          KUBECONFIG: /home/keen/.kube/config
        run: |
          kubectl set image -n keen-prod deployment/portal portal=${{ steps.image.outputs.image }}
          # Session 16 (Production Hardening) — `kubectl set image` doesn't
          # record a change-cause the way `kubectl apply`/`--record` would,
          # so `kubectl rollout history` was otherwise just a list of blank
          # revisions with no way to tell which one is which. This makes
          # the image tag (== the git SHA that built it) visible directly
          # in `kubectl rollout history -n keen-prod deployment/portal` —
          # see portal/docs/PRODUCTION_HARDENING.md's rollback runbook.
          kubectl annotate deployment/portal -n keen-prod \
            kubernetes.io/change-cause="${{ steps.image.outputs.image }}" --overwrite
          kubectl rollout status -n keen-prod deployment/portal --timeout=120s

      - name: Prune old local images
        if: always()
        run: |
          docker images "ghcr.io/bambocharles/keenafrica-portal" --format "{{.Tag}}" \
            | grep -v "^${{ github.sha }}$" \
            | xargs -r -I{} docker rmi "ghcr.io/bambocharles/keenafrica-portal:{}"
          docker image prune -f
