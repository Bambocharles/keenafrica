apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
  namespace: keen-staging
spec:
  replicas: 3
  selector:
    matchLabels: { app: site, env: staging }
  template:
    metadata:
      labels: { app: site, env: staging }
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: site, env: staging }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: ghcr.io/bambocharles/keenafrica:test
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
      imagePullSecrets:
        - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: site
  namespace: keen-staging
spec:
  selector: { app: site, env: staging }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: site
  namespace: keen-staging
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: staging.keenafrica.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: site
                port: { number: 80 }